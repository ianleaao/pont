<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pont tests</title>
  <link rel="stylesheet" href="css/tokens.css">
  <style>
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink);
      font: 16px/1.5 var(--font); }
    main { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 24px; margin: 0 0 8px; }
    #summary { padding: 12px 16px; border-radius: 12px; margin-bottom: 16px; }
    .ok { background: var(--aid-tint); color: var(--aid); }
    .bad { background: var(--gap-tint); color: var(--gap); }
    ol { padding-left: 24px; }
    li { margin: 4px 0; }
    code { font-variant-numeric: tabular-nums; color: var(--muted); }
  </style>
</head>
<body>
<main>
  <h1>Pont tests</h1>
  <p>Engine and money format. Fixed rates: 1 USD = R$ 5.5146 and 1 USD = ₹94 (INR test only). Run with Live Server. Results also go to the console.</p>
  <div id="summary">Running...</div>
  <ol id="results"></ol>
</main>

<script src="js/engine.js"></script>
<script src="js/fx.js"></script>
<script id="engine-tests">
// Test suite. Takes (E = engine, data = { colleges, fees, fx, countries }) and returns [{ name, pass, detail }].
function runPontTests(E, data) {
  const FX = 5.5146; // fixed on purpose: tests must not change with the live rate
  const out = [];
  const near = (a, b, tol) => Math.abs(a - b) <= (tol === undefined ? 0.01 : tol);
  const t = (name, fn) => {
    try {
      const info = fn(); // a returned string is extra info, not a failure
      out.push({ name, pass: true, detail: typeof info === "string" ? info : "" });
    } catch (e) {
      out.push({ name, pass: false, detail: e.message });
    }
  };
  const check = (cond, msg) => { if (!cond) throw new Error(msg); };

  const LUCAS = { collegeId: "ut-austin", programId: "cs", status: "no_visa", country: "BR", term: "fall-2027", englishTest: "toefl", flights: 0 };
  const LUCAS_ACC = Object.assign({}, LUCAS, { collegeId: "acc", programId: "cs-transfer" });
  const IAN = { collegeId: "ut-austin", programId: "cs", status: "citizen_or_pr", country: "BR", term: "fall-2027", flights: 0 };
  const G4 = 1.03 + Math.pow(1.03, 2) + Math.pow(1.03, 3) + Math.pow(1.03, 4); // 4.30913581
  const ut = data.colleges.colleges.find((c) => c.id === "ut-austin");
  const acc = data.colleges.colleges.find((c) => c.id === "acc");

  // --- Data ---
  t("fx.json fallback BRL rate is 5.5146 (PTAX, 2026-11-09)", () => {
    check(data.fx.rates.BRL.rate === FX && data.fx.rates.BRL.set_on === "2026-11-09", "fx.json changed");
  });
  t("INR fallback is null, Not confirmed, with the official link (FBIL)", () => {
    const r = data.fx.rates.INR;
    check(r.rate === null && r.status === "not_confirmed" && /fbil\.org\.in/.test(r.url), JSON.stringify(r));
  });

  // --- 1. Annual ---
  t("Annual with extras, first year at UT (F-1): COA + ISSS 450 + SHIP 4,217.85 = 68,871.85 to 77,583.85", () => {
    const a = E.annualCost(ut, "cs", { status: "no_visa" });
    check(near(a.total.min, 68871.85) && near(a.total.max, 77583.85) && near(a.total.mid, 73227.85), JSON.stringify(a.total));
  });
  t("Annual with extras, later years at UT: SHIP 3,893.40 (mid 72,903.40)", () => {
    const a = E.annualCost(ut, "cs", { status: "no_visa", yearAtCollege: 2 });
    check(near(a.total.mid, 72903.40), JSON.stringify(a.total));
  });
  t("Annual without extras (U.S. citizen): no SHIP, no ISSS fee", () => {
    const a = E.annualCost(ut, "cs", { status: "citizen_or_pr" });
    check(a.total.min === 64204 && a.total.max === 72916, JSON.stringify(a.total));
    check(!a.lines.some((l) => l.id === "ship" || l.id === "isss_fee"), "extras present");
  });
  t("Flights start at 0 and are added only when the user enters a value", () => {
    const a0 = E.annualCost(ut, "cs", { status: "citizen_or_pr", flights: 0 });
    const a1 = E.annualCost(ut, "cs", { status: "citizen_or_pr", flights: 1500 });
    check(!a0.lines.some((l) => l.id === "flights"), "flight line with 0");
    check(a1.total.min - a0.total.min === 1500, "flight not added");
  });
  t("Unconfirmed differential tuition is shown but NOT added", () => {
    const a = E.annualCost(ut, "cs", { status: "no_visa" });
    const d = a.notAdded.find((l) => l.id === "differential");
    check(d && d.amount.min === 1000 && d.reason === "not_confirmed", "differential line missing");
    check(d.note === "May already be included. Confirm with the college.", "wrong note");
    check(!a.lines.some((l) => l.id === "differential"), "differential was added");
  });
  t("ACC uses its F-1 estimate 30,000 with the label 'ACC estimate (first year)' (proof of support page)", () => {
    const a = E.annualCost(acc, "cs-transfer", { status: "no_visa" });
    check(a.total.mid === 30000 && a.lines[0].label === "ACC estimate (first year)", JSON.stringify(a.lines[0]));
    check(a.lines[0].source.id === "acc-proof-support" && a.lines[0].source.url, "source");
  });
  t("ACC health insurance: not required, strongly recommended, with its source", () => {
    const h = acc.health_insurance;
    check(h.required === false && h.label === "Not required, strongly recommended" && h.source === "acc-proof-support", JSON.stringify(h));
    check(acc.health_insurance_required === undefined, "old unsourced field still present");
  });
  t("Unverified colleges return 'not_confirmed', never a number", () => {
    const r = E.programTotal({ collegeId: "texas-am", programId: "cs", status: "no_visa", term: "fall-2027" }, data);
    check(r.status === "not_confirmed" && r.total === undefined, r.status);
  });

  // --- 2. Program total ---
  t("Base year: Fall 2027 year 1 = base x 1.03; Spring 2028 also 2027-28; Fall 2028 = x 1.03^2", () => {
    check(E.termToAcademicYear("fall-2027") === 2027 && E.termToAcademicYear("spring-2028") === 2027, "term map");
    check(E.growthFactor(2027).exp === 1 && E.growthFactor(2028).exp === 2, "exponent");
  });
  t("Total with 0% increase (Ian): 68,560 x 4 = 274,240", () => {
    const r = E.programTotal(IAN, data, { yearlyIncrease: 0 });
    check(r.total.mid === 274240, String(r.total.mid));
  });
  t("Total with 3% increase (Ian): 68,560 x 4.30913581 = 295,434.35", () => {
    const r = E.programTotal(IAN, data);
    check(near(r.total.mid, 68560 * G4) && near(r.total.mid, 295434.35), String(r.total.mid));
  });
  t("Ian has no one-time visa costs", () => {
    const r = E.programTotal(IAN, data);
    check(r.oneTime.lines.length === 0 && r.oneTime.total.mid === 0, "one-time costs present");
  });
  t("Lucas one-time costs: SEVIS 350 + visa 185 + UT app 90 = 625 (TOEFL and SAT not confirmed)", () => {
    const r = E.programTotal(LUCAS, data);
    check(r.oneTime.total.mid === 625, String(r.oneTime.total.mid));
  });
  t("TOEFL and SAT are 'Not confirmed': shown with the official link, NOT added", () => {
    const r = E.programTotal(LUCAS, data);
    ["toefl_brazil", "sat_abroad"].forEach((id) => {
      const l = r.notAdded.find((x) => x.id === id);
      check(l && l.reason === "not_confirmed" && l.source.url, id + " line missing or no link");
      check(!r.oneTime.lines.some((x) => x.id === id), id + " was added");
    });
  });
  t("Visa Integrity Fee (Brazil unconfirmed) is shown but NOT added", () => {
    const r = E.programTotal(LUCAS, data);
    check(r.notAdded.some((l) => l.id === "visa_integrity" && l.reason === "not_confirmed"), "VIF line missing");
    check(!r.oneTime.lines.some((l) => l.id === "visa_integrity"), "VIF added");
  });
  t("Enrollment deposit is NOT added (credited to tuition)", () => {
    const r = E.programTotal(LUCAS, data);
    check(r.notAdded.some((l) => l.id === "enrollment_deposit" && l.reason === "credited_to_tuition"), "deposit line missing");
    check(!r.oneTime.lines.some((l) => l.id === "enrollment_deposit"), "deposit added");
  });
  t("Lucas UT total = 73,227.85 x 1.03 + 72,903.40 x (1.03^2 + 1.03^3 + 1.03^4) + 625", () => {
    const r = E.programTotal(LUCAS, data);
    const expected = 73227.85 * 1.03 + 72903.40 * (G4 - 1.03) + 625;
    check(near(r.total.mid, expected), r.total.mid + " vs " + expected);
    return "total " + r.total.mid.toFixed(2);
  });

  // --- Community-college path ---
  t("ACC + UT: ACC years 1-2 (x1.03, x1.03^2), UT years 3-4 (x1.03^3, x1.03^4)", () => {
    const r = E.transferPath(LUCAS_ACC, data);
    const ids = r.perYear.map((y) => y.collegeId + ":" + y.exponent).join(",");
    check(ids === "acc:1,acc:2,ut-austin:3,ut-austin:4", ids);
    // Year 3 is the first year at UT: SHIP 4,217.85. Year 4: SHIP 3,893.40. One-time: SEVIS + visa + ACC app = 635.
    const expected = 30000 * (1.03 + Math.pow(1.03, 2)) + 73227.85 * Math.pow(1.03, 3) + 72903.40 * Math.pow(1.03, 4) + 635;
    check(near(r.total.mid, expected), r.total.mid + " vs " + expected);
    return "total " + r.total.mid.toFixed(2);
  });
  t("ACC + UT: no new SEVIS or visa fee; UT transfer fee 'Not confirmed' and NOT added", () => {
    const r = E.transferPath(LUCAS_ACC, data);
    check(r.oneTime.lines.filter((l) => l.id === "sevis_f_m").length === 1, "SEVIS counted twice");
    check(r.notes.some((n) => n.id === "transfer_sevis" && n.reason === "not_needed"), "SEVIS note missing");
    check(r.notAdded.some((n) => n.id === "transfer_application_fee" && n.reason === "not_confirmed"), "transfer fee line missing");
  });

  // --- 3 and 4. Monthly and bands ---
  t("Monthly: total / (years x 12), then x rate; engine does not round", () => {
    const m = E.monthly(E.range(48000), 4, FX);
    check(m.usd.mid === 1000 && near(m.family.mid, 5514.6, 1e-9), JSON.stringify(m));
  });
  t("Band edge: exactly equal -> within", () => check(E.budgetBand(1000, 1000) === "within", "not within"));
  t("Band edge: exactly 20% above -> above", () => check(E.budgetBand(1200, 1000) === "above", "not above"));
  t("Band edge: just over 20% above -> well_above", () => check(E.budgetBand(1200.01, 1000) === "well_above", "not well_above"));
  t("Skipped budget -> none (null, undefined, empty, 0)", () => {
    check([null, undefined, "", 0].every((v) => E.budgetBand(5000, v) === "none"), "not none");
  });

  // --- Demo: Lucas at 23,000 BRL ---
  t("Demo Lucas (23,000 BRL): UT is well_above", () => {
    const r = E.evaluate(E.programTotal(LUCAS, data), { fxRate: FX, monthlyAmount: 23000 });
    check(r.band === "well_above", r.band + " " + r.monthly.family.mid);
  });
  t("Demo Lucas (23,000 BRL): ACC + UT is 'above' and between 5% and 15% above", () => {
    const r = E.evaluate(E.transferPath(LUCAS_ACC, data), { fxRate: FX, monthlyAmount: 23000 });
    check(r.band === "above", r.band);
    check(r.gapVsAmount >= 0.05 && r.gapVsAmount <= 0.15,
      "gap " + (r.gapVsAmount * 100).toFixed(1) + "%. Outside 5% to 15%: suggest " +
      Math.round(r.monthly.family.mid / 1.10) + " BRL");
    return "gap " + (r.gapVsAmount * 100).toFixed(1) + "%, R$ " + r.monthly.family.mid.toFixed(0) + " per month";
  });
  t("Demo Lucas (23,000 BRL): 'Out of my budget' lists ACC + UT first; original kept", () => {
    const orig = E.evaluate(E.programTotal(LUCAS, data), { fxRate: FX, monthlyAmount: 23000 });
    const o = E.outOfBudget(orig, LUCAS, data, { fxRate: FX, monthlyAmount: 23000 });
    check(o.options.length >= 1 && o.options[0].kind === "transfer_path", "no transfer path first");
    check(!o.options.some((x) => x.kind === "single" && x.collegeId === "acc"), "ACC alone listed as a bachelor's option");
    check(o.stillWellAbove === false && o.original === orig, "flags");
  });
  t("Demo Lucas: I-20 uses the UT published amount 71,912 (2026-27), not the estimate", () => {
    const s = E.showForI20(E.programTotal(LUCAS, data), data);
    check(s.estimate === false && s.amount === 71912 && s.year === "2026-27", JSON.stringify(s));
    check(s.breakdown[0].amount + s.breakdown[1].amount === 71912, "breakdown does not add up");
    check(s.label === "2026-27 amount. The amount for your start year is not published yet and may be higher.", "note");
    check(s.source.url === "https://global.utexas.edu/isss/immigration/f-1/financial-information", "source");
  });
  t("ACC I-20: published 30,000 shown as published, never inflated", () => {
    const s = E.showForI20(E.transferPath(LUCAS_ACC, data), data);
    check(s.estimate === false && s.amount === 30000, JSON.stringify(s));
    check(s.breakdown[0].amount + s.breakdown[1].amount === 30000, "breakdown does not add up");
    check(s.label === "Estimates, subject to change. The year is not stated on the page.", "note");
    check(s.source.id === "acc-proof-support" && s.source.url, "source");
  });
  t("I-20 without a published amount: MAX of the year 1 estimate (ACC copy without i20: 30,000 x 1.03 = 30,900)", () => {
    const noI20 = JSON.parse(JSON.stringify(data.colleges));
    delete noI20.colleges.find((c) => c.id === "acc").i20;
    const s = E.showForI20(E.transferPath(LUCAS_ACC, Object.assign({}, data, { colleges: noI20 })), data);
    check(s.estimate === true && near(s.amount, 30900), JSON.stringify(s));
    check(s.label === "Estimate. The college confirms the exact amount.", "label");
  });

  // --- Aid data (docs/aid-data.md, checked 2026-11-13) ---
  const AID_FIELDS = ["intl_admission_policy", "intl_need_based_aid", "meets_full_need_intl", "merit_aid_intl",
    "f1_aid", "thresholds", "forms_intl", "forms_us", "deadlines", "outside_scholarships_allowed"];
  const VERIFIED = ["ut-austin", "acc", "harvard", "mit", "amherst"];
  const col = (id) => data.colleges.colleges.find((c) => c.id === id);
  t("Every aid field has a date and either a value with a source or null with 'not_confirmed'", () => {
    const bad = [];
    const noPage = [];
    VERIFIED.forEach((id) => {
      const aid = col(id).aid;
      if (!aid) { bad.push(id + ": no aid block"); return; }
      AID_FIELDS.forEach((k) => {
        const v = aid[k];
        if (!v || v.checked_on !== "2026-11-13") { bad.push(id + "." + k + " date"); return; }
        if (v.value === null || v.value === undefined) {
          if (v.status !== "not_confirmed") bad.push(id + "." + k + " null without not_confirmed");
        } else if (!v.source) noPage.push(id + "." + k);
      });
    });
    check(bad.length === 0, bad.join(", "));
    check(noPage.length === 0, "value without a source page: " + noPage.join(", "));
  });
  t("Outside scholarships: Harvard from 'how aid works'; Amherst from 'gift aid' with the confirm note", () => {
    const h = col("harvard").aid.outside_scholarships_allowed;
    const a = col("amherst").aid.outside_scholarships_allowed;
    check(h.value === true && h.source === "harvard-how-aid-works", JSON.stringify(h));
    const url = col("amherst").sources.find((s) => s.id === a.source).url;
    check(a.value === true && /gift_aid$/.test(url) && /Confirm with Amherst/.test(a.note), JSON.stringify(a));
  });
  t("Amherst U.S. forms: FAFSA only (002115); CSS Profile for U.S. citizens not confirmed", () => {
    const f = col("amherst").aid.forms_us;
    check(f.value.length === 1 && f.value[0] === "fafsa" && f.codes.fafsa === "002115", JSON.stringify(f));
    check(f.css_profile_us.value === null && f.css_profile_us.status === "not_confirmed", "css_profile_us");
  });
  t("Every aid source id points to a listed source with an official URL", () => {
    const bad = [];
    VERIFIED.forEach((id) => {
      const c = col(id);
      const ids = c.sources.map((s) => s.id);
      AID_FIELDS.forEach((k) => {
        const s = c.aid[k].source;
        if (s && !ids.includes(s)) bad.push(id + "." + k + " -> " + s);
      });
      c.sources.forEach((s) => { if (!/^https:\/\//.test(s.url)) bad.push(id + " " + s.id + " url"); });
    });
    check(bad.length === 0, bad.join(", "));
  });
  t("UT: old aid_for_internationals and aid_form removed; no need-based aid for incoming F-1; merit limited", () => {
    const ut = col("ut-austin");
    check(ut.aid_for_internationals === undefined && ut.aid_form === undefined, "old fields present");
    check(ut.aid.intl_need_based_aid.value === false && ut.aid.merit_aid_intl.value === "limited", "aid values");
    check(ut.aid.intl_admission_policy.status === "not_confirmed", "need-blind should be not confirmed");
  });
  t("Harvard, MIT, Amherst: need-blind, full need for internationals, no merit aid", () => {
    ["harvard", "mit", "amherst"].forEach((id) => {
      const a = col(id).aid;
      check(col(id).status === "verified" && a.intl_admission_policy.value === "need_blind" &&
        a.meets_full_need_intl.value === true && a.merit_aid_intl.value === "none", id);
    });
  });
  t("Harvard thresholds apply to internationals (with the note); MIT thresholds are NOT confirmed for internationals", () => {
    const h = col("harvard").aid.thresholds.value;
    check(h[0].income_below_usd === 100000 && h[0].rule === "parent_contribution_zero" && h[0].applies_to_intl === true && h[0].covers === null, "harvard 100k");
    const m = col("mit").aid.thresholds.value;
    check(m.every((x) => x.applies_to_intl === null && x.status === "not_confirmed"), "mit thresholds");
  });
  t("New colleges: one program 'Undergraduate, undeclared', area 'any', 4 years", () => {
    ["harvard", "mit", "amherst"].forEach((id) => {
      const p = col(id).programs;
      check(p.length === 1 && p[0].name === "Undergraduate, undeclared" && p[0].area === "any" && p[0].years === 4, id);
    });
  });
  t("Published cost lines add up: Harvard 95,134 to 100,134; MIT 92,760; Amherst sum of lines 98,160", () => {
    const sum = (id) => col(id).cost_of_attendance_2026_27.lines.filter((l) => l.added)
      .reduce((s, l) => ({ min: s.min + (l.amount != null ? l.amount : l.min), max: s.max + (l.amount != null ? l.amount : l.max) }), { min: 0, max: 0 });
    const h = sum("harvard"), m = sum("mit"), a = sum("amherst");
    check(h.min === 95134 && h.max === 100134 && col("harvard").cost_of_attendance_2026_27.total.max === 100134, JSON.stringify(h));
    check(m.min === 92760 && col("mit").cost_of_attendance_2026_27.total.min === 92760, JSON.stringify(m));
    const coa = col("amherst").cost_of_attendance_2026_27;
    check(a.min === 98160 && coa.total === null && coa.total_label === "Sum of published lines", JSON.stringify(a));
  });
  t("Insurance: Harvard 4,954 added (unless a family plan); MIT and Amherst shown, not added, not confirmed", () => {
    const h = col("harvard").required_extras_per_year.find((x) => x.id === "health_insurance");
    check(h.amount === 4954 && /family plan/.test(h.note), "harvard");
    ["mit", "amherst"].forEach((id) => {
      const x = col(id).shown_not_added_per_year.find((y) => y.id === "health_insurance");
      check(x.amount === null && x.status === "not_confirmed", id);
    });
  });
  t("Travel is never invented: Harvard a published range, MIT and Amherst 'varies' and not added", () => {
    const t1 = col("harvard").cost_of_attendance_2026_27.lines.find((l) => l.id === "transportation");
    check(t1.min === 0 && t1.max === 5000 && t1.added, "harvard");
    ["mit", "amherst"].forEach((id) => {
      const l = col(id).cost_of_attendance_2026_27.lines.find((x) => x.id === "travel");
      check(l.amount === null && l.added === false && l.status === "varies", id);
    });
  });
  t("Document rules stored per college; UT keeps i20.document_rules", () => {
    check(col("ut-austin").i20.document_rules.max_pages === 10, "ut");
    check(col("harvard").document_rules.translation.own_translation_ok === true && col("harvard").document_rules.channel.channel === "IDOC", "harvard");
    check(col("mit").document_rules.channel.channel === "IDOC", "mit");
    const a = col("amherst").document_rules;
    check(a.format.pdf_only === true && a.signature.digital_ok === false, "amherst");
    check(col("acc").document_rules.status === "not_confirmed", "acc");
  });

  // --- Lucas at 2,000 BRL (old value, kept as a test case) ---
  t("Lucas at 2,000 BRL: everything well_above and stillWellAbove (\"This path is also above...\")", () => {
    const ctx = { fxRate: FX, monthlyAmount: 2000 };
    const orig = E.evaluate(E.programTotal(LUCAS, data), ctx);
    const o = E.outOfBudget(orig, LUCAS, data, ctx);
    check(orig.band === "well_above" && o.options.every((x) => x.band === "well_above"), "bands");
    check(o.stillWellAbove === true, "stillWellAbove false");
  });
  t("Recommendations with a budget: well_above goes to 'More colleges'", () => {
    const ctx = { fxRate: FX, monthlyAmount: 2000 };
    const rec = E.recommend([E.evaluate(E.programTotal(LUCAS, data), ctx)], true);
    check(rec.main.length === 0 && rec.more.length === 1, JSON.stringify([rec.main.length, rec.more.length]));
  });

  // --- Demo: Ian ---
  t("Demo Ian (skipped amount): band 'none' (Total cost); no I-20 amount", () => {
    const r = E.evaluate(E.programTotal(IAN, data), { fxRate: FX, monthlyAmount: null });
    check(r.band === "none" && r.gapVsAmount === null, r.band);
    check(E.showForI20(r) === null, "I-20 shown to a citizen");
  });
  t("Ian residency check: both scenarios, engine does not pick one", () => {
    const s = E.residencyScenarios(IAN, data);
    check(s.nonresident.annual.total.min === 64204 && s.nonresident.annual.total.max === 72916, "nonresident");
    check(s.resident.annual.total.min === 32508 && s.resident.annual.total.max === 35386, "resident");
    check(!("chosen" in s) && s.sources[0].url === "https://onestop.utexas.edu", "source");
  });
  t("Recommendations without a budget: sorted by cost", () => {
    const ctx = { fxRate: FX, monthlyAmount: null };
    const a = E.evaluate(E.programTotal(IAN, data), ctx);
    const b = E.evaluate(E.programTotal(Object.assign({}, IAN, { residency: "resident" }), data), ctx);
    const rec = E.recommend([a, b], false);
    check(rec.main[0] === b && rec.more.length === 0, "order");
  });

  // --- Sources ---
  t("Every added line has a source and a date", () => {
    const r = E.programTotal(LUCAS, data);
    const lines = r.annual.lines.concat(r.oneTime.lines);
    const missing = lines.filter((l) => !l.source || !l.source.checked_on).map((l) => l.id);
    check(missing.length === 0, "no date: " + missing.join(", "));

    return noUrl.length ? "no official link yet: " + noUrl.join(", ") : true;
  });


  // --- Funding engine (docs/funding-and-currency.md sections 2 to 5) ---
  const INR_TEST = 94; // TEST ONLY, same as the fx tests
  const TODAY = "2026-11-17";
  const ANANYA = { area: "any", colleges: [{ collegeId: "harvard", programId: "undeclared" }], passports: ["IN"],
    parentCountries: ["IN"], status: "no_visa", term: "fall-2027", currency: "INR", monthly: 10000, incomeBand: "under_65k" };
  const LUCAS_A = { area: "cs", colleges: [{ collegeId: "ut-austin", programId: "cs" }], passports: ["BR"],
    parentCountries: ["BR"], status: "no_visa", term: "fall-2027", currency: "BRL", monthly: 23000 };

    parentCountries: ["BR"], status: "citizen_or_pr", term: "fall-2027", currency: "BRL", monthly: null };
  const fcol = (id) => data.colleges.colleges.find((c) => c.id === id);

    country: answers.passports[0], term: answers.term, flights: 0 }, data);

  const group = (r, id) => r.groups.find((g) => g.id === id);

    averagePerYear: E.range(perYear), year1: E.range(perYear), notConfirmed: (pending || []).map((l) => ({ id: l, label: l })) });

  t("Cost lines: Harvard 95,134 to 100,134 + insurance 4,954; MIT 92,760; Amherst 98,160; travel and unconfirmed insurance not added", () => {
    const h = E.annualCost(fcol("harvard"), "undeclared", { status: "no_visa" });
    check(h.total.min === 100088 && h.total.max === 105088, JSON.stringify(h.total));
    const m = E.annualCost(fcol("mit"), "undeclared", { status: "no_visa" });
    check(m.total.mid === 92760 && m.notAdded.some((l) => l.id === "travel") && m.notAdded.some((l) => l.id === "health_insurance"), "mit");
    const a = E.annualCost(fcol("amherst"), "undeclared", { status: "no_visa" });

  t("Ananya at Harvard (under 65k): threshold, parent contribution 0, visa fees paid by the family, the rest 'Not confirmed'", () => {

    check(n.method === "threshold" && n.threshold.rule === "parent_contribution_zero" && n.hasEstimate, n.method);

  t("Ananya (10,000 INR per month): 'Funded', and the not-confirmed list travels with the label", () => {

    check(g.notConfirmed === n.notConfirmed && g.notConfirmed.length >= 3, "list missing");
    check(g.note.indexOf("Covers every confirmed cost. Still to confirm: Student contribution, Travel, Personal costs") === 0, g.note);

  t("'Funded' never shows alone; 'Small gap' and 'Gap' carry 'Still to confirm' when lines are pending", () => {

  t("Harvard over 200k: above every threshold -> calculator_link", () => {

  t("No income band (Lucas at Harvard): full cost plus 'Share an income range to see aid estimates.'", () => {

  t("UT for Lucas (F-1): full cost, merit 'possible, not guaranteed', label 'Gap'", () => {

    check(n.method === "full_cost" && n.merit === "Merit scholarships: possible, not guaranteed.", n.method);

  });
  t("Ian (U.S. citizen): FAFSA open, so UT uses calculator_link to the Texas One Stop aid page, not full cost", () => {
    const n = netFor(IAN_A, "ut-austin", "cs");
    check(n.method === "calculator_link" && n.aidPage.label === "Official aid page", n.method);

  t("Routes: three groups in order 'Your dream', 'Strong aid for you', 'Lower-cost path'; dream college first", () => {
    const r = E.routes(LUCAS_A, data, { fxRate: FX, today: TODAY });
    check(r.groups.map((g) => g.label).join("|") === "Your dream|Strong aid for you|Lower-cost path", "labels");
    check(group(r, "dream").items.length === 1 && group(r, "dream").items[0].collegeId === "ut-austin", "dream");

  t("Lucas routes: Harvard, MIT, Amherst in 'Strong aid for you'; ACC then UT in 'Lower-cost path' with 'Small gap'", () => {
    const r = E.routes(LUCAS_A, data, { fxRate: FX, today: TODAY });
    check(group(r, "strong_aid").items.map((i) => i.collegeId).sort().join() === "amherst,harvard,mit", "strong aid");
    const lc = group(r, "lower_cost").items[0];
    check(lc.kind === "transfer_path" && lc.collegeId === "acc" && lc.targetCollegeId === "ut-austin", "lower cost");
    check(lc.gap.label === "Small gap", lc.gap.label);
    return "ACC then UT: " + (lc.gap.gapShare * 100).toFixed(1) + "% above";
  });
  t("Ananya routes: Harvard 'Funded'; MIT and Amherst in 'Strong aid for you' with no estimate", () => {
    const r = E.routes(ANANYA, data, { fxRate: INR_TEST, today: TODAY });
    check(group(r, "dream").items[0].gap.label === "Funded", "harvard");
    check(group(r, "strong_aid").items.map((i) => i.collegeId).sort().join() === "amherst,mit", "strong aid");
    check(group(r, "strong_aid").items.every((i) => i.gap.label === null && !i.netPrice.hasEstimate), "no estimate");
    check(group(r, "lower_cost").items.length === 0, "lower cost");
  });
  t("Inside each group, colleges without an estimate sort after the ones with an estimate", () => {
    const ans = Object.assign({}, ANANYA, { colleges: [{ collegeId: "mit", programId: "undeclared" },
      { collegeId: "harvard", programId: "undeclared" }] });
    const ids = group(E.routes(ans, data, { fxRate: INR_TEST, today: TODAY }), "dream").items.map((i) => i.collegeId);
    check(ids.join() === "harvard,mit", ids.join());
  });
  t("Deadlines: Amherst ED aid deadline 2026-11-13 is past on 2026-11-17; next is RD 2027-01-15", () => {
    const d = E.nextDeadline(fcol("amherst"), "fall-2027", TODAY);
    check(d.past.length === 1 && d.past[0].date === "2026-11-13" && d.next.date === "2027-01-15", JSON.stringify(d));
    check(E.nextDeadline(fcol("harvard"), "fall-2027", TODAY).next.date === "2027-02-01", "harvard");
  });

  // --- Overview helpers (task D): deadline list and funding bar ---
  const OV_TODAY = "2026-11-19";
  const dlFor = (ans, fx) => E.deadlineList(E.routes(ans, data, { fxRate: fx, today: OV_TODAY }), data, { term: ans.term, today: OV_TODAY });
  t("Deadline list (Ananya, 2026-11-19): sorted; passed ones marked; next is MIT Early Action aid, Nov 30, 11 days", () => {

    check(d.filter((x) => x.status === "passed").map((x) => x.date).join() === "2026-11-01,2026-11-01,2026-11-13", "passed");
    const next = d.find((x) => x.status === "to_do");
    check(next.collegeId === "mit" && next.date === "2026-11-30" && next.daysLeft === 11 && next.kind === "aid", JSON.stringify(next));
    check(next.forms.join() === "css_profile,idoc" && next.codes.css_profile === "3514", "forms");
    const h = d.find((x) => x.collegeId === "harvard" && x.kind === "admission" && x.round === "regular");
    check(h.date === "2027-01-01" && h.daysLeft === 43, "harvard RD");
    check(!d.some((x) => /open|decision_/.test(x.round)), "opening or decision dates listed");
  });
  t("Deadline windows: ACC opens 01-15, priority 2027-05-01, closes 2027-12-15; UT scholarships 2026-12-01", () => {
    const d = dlFor(LUCAS_A, FX);
    const get = (c, r) => d.find((x) => x.collegeId === c && x.round === r).date;
    check(get("acc", "priority") === "2027-05-01" && get("acc", "closes") === "2027-12-15", "acc");
    check(get("ut-austin", "scholarships_via_application") === "2026-12-01" && get("ut-austin", "isss_scholarships_close") === "2027-03-01", "ut");
  });
  t("Deadline list (Ian): no ISSS dates and no dates from routes without data for his situation", () => {
    const d = dlFor(IAN_A, FX);
    check(!d.some((x) => /^isss/.test(x.round)) && !d.some((x) => x.collegeId === "acc"), d.map((x) => x.id).join());
  });
  t("Funding bar (Ananya at Harvard): aid, family, hatched not-confirmed part at a fixed width; shares add up to 1", () => {
    const it = E.routes(ANANYA, data, { fxRate: INR_TEST, today: OV_TODAY }).groups[0].items[0];
    const b = E.fundingBar(it.netPrice, it.gap);
    check(b.segments.map((x) => x.id).join() === "aid,family,not_confirmed", b.segments.map((x) => x.id).join());
    check(near(b.segments[1].amount, 535 / 4) && b.segments[2].amount === null && b.segments[2].share === 0.06, "amounts");
    check(b.segments[1].share >= 0.02 * 0.94 - 1e-9, "family part too small to see");
    check(near(b.segments.reduce((sum, x) => sum + x.share, 0), 1, 1e-9), "shares");
  });
  t("Funding bar (Lucas at UT): family can cover, then the gap segment; no aid segment", () => {
    const it = E.routes(LUCAS_A, data, { fxRate: FX, today: OV_TODAY }).groups[0].items[0];
    const b = E.fundingBar(it.netPrice, it.gap);
    check(b.segments.map((x) => x.id).join() === "family,gap,not_confirmed", b.segments.map((x) => x.id).join());
    check(near(b.segments[0].amount + b.segments[1].amount, it.gap.netPerYear, 1e-6), "family + gap = net per year");
  });
  t("Funding bar: no estimate (Ian at UT) -> no bar", () => {
    const it = E.routes(IAN_A, data, { fxRate: FX, today: OV_TODAY }).groups[0].items[0];
    check(E.fundingBar(it.netPrice, it.gap) === null, "bar drawn");
  });
  return out;
}

<script id="fx-tests">
// Money format and currency tests. Takes (F = PontFx, data = { countries, fx }) and returns [{ name, pass, detail }].
// No network: only formatting, currency mapping and the fallback file.
function runFxTests(F, data) {
  const BRL = 5.5146;  // BCB PTAX fallback, same as the engine tests
  const INR = 94;      // TEST ONLY. Not a confirmed rate (the INR fallback in fx.json is null).
  const out = [];
  const t = (name, fn) => {
    try {
      const info = fn();
      out.push({ name, pass: true, detail: typeof info === "string" ? info : "" });
    } catch (e) {
      out.push({ name, pass: false, detail: e.message });
    }
  };
  const check = (cond, msg) => { if (!cond) throw new Error(msg); };
  // Intl puts no-break spaces in some formats; compare with plain spaces.
  const plain = (s) => String(s).replace(/[  ]/g, " ");
  const eq = (got, want) => check(plain(got) === want, "got \"" + plain(got) + "\", want \"" + want + "\"");
  const info = (currency, rate, extra) => Object.assign({ currency, rate, rateDate: "2026-11-10",
    sourceLabel: "Frankfurter (central bank data)", credit: null, notice: null, status: "ok" }, extra || {});

  F.configure(data.countries);

  t("countries.json has the 9 prototype countries, each with currency and locale", () => {
    const codes = Object.keys(data.countries.countries).sort().join(",");
    check(codes === "BR,CN,CO,IN,KR,MX,NG,US,VN", codes);
    Object.values(data.countries.countries).forEach((c) => check(c.currency && c.locale, c.name));
  });
  t("India: family language en by default, Hindi as alternative", () => {
    const c = data.countries.countries.IN;
    check(c.family_language === "en" && c.family_language_alternatives.join() === "hi", JSON.stringify(c));
  });
  t("ESTA and home scholarships: never invented (null with a status)", () => {
    Object.entries(data.countries.countries).forEach(([k, c]) => {
      check(c.esta.value === null && c.esta.status, k + " esta");
      check(c.home_scholarships === null, k + " scholarships");
    });
  });
  t("fx.json: only BRL and INR may have a fallback; the other 6 are null, Not confirmed", () => {
    ["MXN", "COP", "NGN", "VND", "CNY", "KRW"].forEach((c) => {
      const r = data.fx.rates[c];
      check(r && r.rate === null && r.status === "not_confirmed", c);
    });
  });

  t("USD in en-US, no cents: $315,110", () => eq(F.formatMoney(315109.84, "USD"), "$315,110"));
  t("BRL in pt-BR, no cents: R$ 36.202", () => eq(F.formatMoney(36202.4, "BRL"), "R$ 36.202"));
  t("INR in en-IN, lakh grouping: ₹29,62,050", () => eq(F.formatMoney(2962050, "INR"), "₹29,62,050"));
  t("VND in vi-VN: 93.000.000 ₫", () => eq(F.formatMoney(93000000, "VND"), "93.000.000 ₫"));
  t("MXN shows the code, never a bare $: MXN 150,000", () => eq(F.formatMoney(150000, "MXN"), "MXN 150,000"));

  t("Rate below 1,000 has 2 decimals: R$ 5,51 and ₹94.00", () => {
    eq(F.formatRate(BRL, "BRL"), "R$ 5,51");
    eq(F.formatRate(INR, "INR"), "₹94.00");
  });
  t("Rate at 1,000 and above has no decimals: 25.750 ₫ and ₦1,354", () => {
    eq(F.formatRate(25750, "VND"), "25.750 ₫");
    eq(F.formatRate(1354.15, "NGN"), "₦1,354");
    check(F.rateDigits(999.99) === 2 && F.rateDigits(1000) === 0, "edge at 1,000");
  });
  t("Rate in two lines: value and source with date", () => {
    const l = F.rateLines(info("BRL", BRL));
    eq(l.value, "1 USD = R$ 5,51");
    eq(l.source.text, "Source: Frankfurter (central bank data), Nov 10, 2026");
  });
  t("ExchangeRate-API source is a credit link", () => {
    const l = F.rateLines(info("INR", INR, { credit: { text: "Rates By Exchange Rate API", url: "https://www.exchangerate-api.com" } }));
    check(l.source.url === "https://www.exchangerate-api.com" && l.source.name === "Rates By Exchange Rate API", JSON.stringify(l.source));
  });
  t("Currency without any rate: no value, notice says Not confirmed", () => {
    const l = F.rateLines(info("NGN", null, { status: "not_confirmed", notice: "Could not get an exchange rate for NGN. Not confirmed." }));
    check(l.value === null && /Not confirmed/.test(l.notice), JSON.stringify(l));
  });

  t("Family currencies come from the parents' countries; USD families get none", () => {
    check(F.familyCurrencies(["US"], data.countries).length === 0, "USD family has a rate");
    check(F.familyCurrencies([], data.countries).length === 0, "no country yet, but a rate");
    check(F.familyCurrencies(["IN"], data.countries).join() === "INR", "IN");
  });
  t("Two-currency family (parents in Brazil and India): both currencies, no duplicates", () => {
    const cur = F.familyCurrencies(["BR", "IN", "BR", "US"], data.countries);
    check(cur.join() === "BRL,INR", cur.join());
    const lines = [F.rateLines(info("BRL", BRL)).value, F.rateLines(info("INR", INR)).value].map(plain);
    check(lines.join(" | ") === "1 USD = R$ 5,51 | 1 USD = ₹94.00", lines.join(" | "));
  });
  t("Same USD amount in both family currencies (36,202 USD)", () => {
    eq(F.formatMoney(36202 * BRL, "BRL"), "R$ 199.640");
    eq(F.formatMoney(36202 * INR, "INR"), "₹34,02,988");
  });

  return out;
}

  try {
    const [colleges, fees, fx, countries] = await Promise.all(
      ["data/colleges.json", "data/fees.json", "data/fx.json", "data/countries.json"].map(load));
    const results = runPontTests(window.PontEngine, { colleges, fees, fx, countries })
      .concat(runFxTests(window.PontFx, { countries, fx }));
    const list = document.getElementById("results");
    results.forEach((r) => {
      const li = document.createElement("li");
      li.textContent = (r.pass ? "PASS  " : "FAIL  ") + r.name;
      if (r.detail) {
        const c = document.createElement("code");
        c.textContent = "  " + r.detail;
        li.appendChild(c);
      }
      list.appendChild(li);
      (r.pass ? console.log : console.error)("[Pont test]", r.pass ? "PASS" : "FAIL", r.name, r.detail || "");
    });
    const failed = results.filter((r) => !r.pass).length;
    summary.textContent = failed ? failed + " of " + results.length + " tests failed." : "All " + results.length + " tests passed.";
    summary.className = failed ? "bad" : "ok";
  } catch (e) {
    summary.textContent = "Could not run the tests: " + e.message + ". Open this page with Live Server.";
    summary.className = "bad";
  }
})();
</script>
</body>
</html>
